name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: character_swap
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Plain Postgres stands in for Supabase: Drizzle migrations are the only schema source either way.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/character_swap
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ONNX and MediaPipe files `npm ci` and `npm run build` fetch (scripts/fetch-models.ts).
      - uses: actions/cache@v4
        with:
          path: |
            models
            public/models/mediapipe
          key: models-${{ hashFiles('scripts/fetch-models.ts') }}

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
